<!doctype html>
<html lang="fr">
  <head><meta charset="UTF-8" /><title>Signature</title></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Bodoni Moda"; font-style: italic; font-weight: 400 700; src: url("assets/fonts/bodoni-italic.woff2") format("woff2"); }
        @font-face { font-family: "Albert Sans"; font-style: normal; font-weight: 300 600; src: url("assets/fonts/albert-var.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: #f3ecdc; }
        #brand { font: italic 400 210px/1 "Bodoni Moda", serif; letter-spacing: -.03em; margin: 0; }
        #brand span { display: inline-block; }
        #brand-rule { width: 380px; height: 1px; margin: 44px auto 34px; background: #e6b064; transform-origin: 50% 50%; }
        #brand-sub { font: 400 28px "Albert Sans", sans-serif; letter-spacing: .38em; text-transform: uppercase; color: #a3acc9; margin: 0; }
      </style>

      <div id="root" data-composition-id="outro" data-width="1920" data-height="1080">
        <div>
          <p id="brand"><span>Vespérale</span></p>
          <div id="brand-rule"></div>
          <p id="brand-sub">Six infusions pour la nuit · Nyons</p>
        </div>
      </div>

      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.from("#brand span", { y: 60, opacity: 0, filter: "blur(14px)", duration: 1.0, ease: "expo.out" }, 0.1);
          tl.from("#brand-rule", { scaleX: 0, duration: 0.9, ease: "expo.inOut" }, 0.25);
          tl.from("#brand-sub", { y: 16, opacity: 0, duration: 0.7, ease: "expo.out" }, 0.45);
          window.__timelines["outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
